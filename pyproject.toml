# ABOUTME: Package configuration for ComfyUI Registry publishing
# ABOUTME: Defines dependencies, metadata, and ComfyUI-specific settings

[project]
name = "comfyui-nodes-erpk"
description = "ERPK custom nodes for ComfyUI: WaveSpeed AI (Seedream V4/V4.5, Qwen Image), Claude API, and Google Gemini API integrations for image generation, editing, text generation, and vision analysis."
version = "2025.12.0"
license = { file = "LICENSE" }
dependencies = [
    "requests>=2.31.0",
    "Pillow>=10.0.0",
    "pydantic>=2.0.0",
    "anthropic>=0.40.0",
    "google-genai>=0.2.0",
    "urllib3>=1.26.0",
]
