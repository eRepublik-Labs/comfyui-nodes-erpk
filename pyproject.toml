# ABOUTME: Package configuration for ComfyUI Registry publishing
# ABOUTME: Defines dependencies, metadata, and ComfyUI-specific settings

[project]
name = "comfyui-nodes-erpk"
description = "ERPK custom nodes for ComfyUI: WaveSpeed AI, Claude API, Google Gemini API, OpenAI API, Background Removal, and Apple SHARP 3D view synthesis."
version = "2026.2.21"
license = { file = "LICENSE" }
dependencies = [
    "requests>=2.31.0",
    "Pillow>=12.1.1",
    "pydantic>=2.0.0",
    "anthropic>=0.40.0",
    "google-genai>=1.56.0",
    "openai>=1.0.0",
    "urllib3>=1.26.0",
    "cryptography>=46.0.5",
    # Background removal
    "tqdm>=4.65.0",
    "opencv-contrib-python>=4.8.0",
    "rembg[gpu]>=2.0.70",
    "numba>=0.61.0",
    "onnxruntime>=1.16.0; sys_platform == 'darwin'",
    "transparent-background>=1.2.0",
    "transformers>=4.36.0",
    "torchvision>=0.16.0",
    "safetensors>=0.4.0",
    "huggingface-hub>=0.20.0",
    "einops>=0.6.0",
    "timm>=1.0.10",
]
classifiers = [
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/eRepublik-Labs/comfyui-nodes-erpk"
Documentation = "https://github.com/eRepublik-Labs/comfyui-nodes-erpk/wiki"
"Bug Tracker" = "https://github.com/eRepublik-Labs/comfyui-nodes-erpk/issues"

[tool.comfy]
PublisherId = "erpk"
DisplayName = "ERPK Custom Nodes"
Icon = "https://raw.githubusercontent.com/eRepublik-Labs/comfyui-nodes-erpk/main/icon.png"
# requires-comfyui = ">=1.0.0"
