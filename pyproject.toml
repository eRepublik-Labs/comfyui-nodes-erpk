# ABOUTME: Package configuration for ComfyUI Registry publishing
# ABOUTME: Defines dependencies, metadata, and ComfyUI-specific settings

[project]
name = "comfyui-nodes-erpk"
description = "ERPK custom nodes for ComfyUI: WaveSpeed AI, Claude API, Google Gemini API, OpenAI API, and Apple SHARP 3D view synthesis."
version = "2026.4.22"
license = { file = "LICENSE" }
dependencies = [
    "requests>=2.31.0",
    "Pillow>=12.1.1",
    "pydantic>=2.0.0",
    "anthropic>=0.96.0",
    "google-genai>=1.73.1",
    "openai>=2.32.0",
    "urllib3>=1.26.0",
    "cryptography>=46.0.5",
]
classifiers = [
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/eRepublik-Labs/comfyui-nodes-erpk"
Documentation = "https://github.com/eRepublik-Labs/comfyui-nodes-erpk/wiki"
"Bug Tracker" = "https://github.com/eRepublik-Labs/comfyui-nodes-erpk/issues"

[tool.comfy]
PublisherId = "erpk"
DisplayName = "ERPK Custom Nodes"
Icon = "https://raw.githubusercontent.com/eRepublik-Labs/comfyui-nodes-erpk/main/icon.png"
# requires-comfyui = ">=1.0.0"
