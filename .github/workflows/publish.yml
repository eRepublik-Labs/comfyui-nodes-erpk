# ABOUTME: GitHub Actions workflow for publishing to ComfyUI Registry
# ABOUTME: Triggers on GitHub releases or manual dispatch

name: Publish to Comfy Registry

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  issues: write
  contents: read

jobs:
  publish-node:
    name: Publish Custom Node to Registry
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'eRepublik-Labs' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Publish Custom Node
        uses: Comfy-Org/publish-node-action@v1
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}

      - name: Update Registry Changelog
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          # Extract version from pyproject.toml
          VERSION=$(grep -E '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          echo "Version: $VERSION"

          # Get release notes from GitHub release using gh CLI (avoids shell interpolation issues).
          # RELEASE_TAG arrives through env rather than a GitHub expression spliced into this
          # script, so a crafted tag name cannot break out of the shell. Note that expressions
          # are evaluated inside run blocks even within comments, so do not write one here:
          # https://github.blog/security/vulnerability-research/how-to-catch-github-actions-workflow-injections-before-attackers-do/
          RELEASE_BODY=$(gh release view "$RELEASE_TAG" --json body -q .body 2>/dev/null || echo "")

          echo "Release tag: $RELEASE_TAG"
          echo "Release body length: ${#RELEASE_BODY}"

          # Skip if no release body
          if [ -z "$RELEASE_BODY" ]; then
            echo "No release notes found, skipping changelog update"
            exit 0
          fi

          # Look up the version UUID from the registry API
          # The PUT endpoint requires the database UUID, not the version string
          VERSION_ID=$(curl -s "https://api.comfy.org/nodes/comfyui-nodes-erpk/versions?limit=5" \
            | jq -r --arg v "$VERSION" '.[] | select(.version == $v) | .id')

          if [ -z "$VERSION_ID" ]; then
            echo "Warning: Could not find version UUID for $VERSION, skipping changelog update"
            exit 0
          fi
          echo "Version UUID: $VERSION_ID"

          # Escape JSON special characters (write to file first to preserve formatting)
          echo "$RELEASE_BODY" > release_notes.txt
          ESCAPED_BODY=$(cat release_notes.txt | jq -Rs .)

          # Update changelog via registry API using the version UUID
          echo "Updating changelog for version $VERSION ($VERSION_ID)..."

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X PUT "https://api.comfy.org/publishers/erpk/nodes/comfyui-nodes-erpk/versions/$VERSION_ID" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${REGISTRY_TOKEN}" \
            -d "{\"changelog\": $ESCAPED_BODY}")

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Changelog updated successfully (HTTP $HTTP_STATUS)"
          else
            echo "Warning: Changelog update returned HTTP $HTTP_STATUS"
            # Don't fail the workflow - publishing succeeded
          fi

      # A successful upload is not a successful release. The Registry scans the
      # version afterwards, and a scan that marks it Flagged leaves the previous
      # Active version being served to users while this workflow still reports
      # green. 2026.8.1 and 2026.8.2 sat Flagged for a month before anyone
      # noticed. Poll until the version reaches a terminal state.
      - name: Verify the Registry is serving this version
        run: |
          VERSION=$(grep -E '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          VERSIONS_URL="https://api.comfy.org/nodes/comfyui-nodes-erpk/versions?limit=10"
          # 2026.8.3 was still Pending 52 minutes after upload, so no deadline
          # short enough to be useful can tell a slow scan from a stuck one.
          # Only a terminal status is a verdict; Pending at the deadline warns.
          TIMEOUT_SECONDS=2700
          STATUS=""

          echo "Waiting for $VERSION to leave Pending (up to $((TIMEOUT_SECONDS / 60)) minutes)..."

          while [ "$SECONDS" -lt "$TIMEOUT_SECONDS" ]; do
            STATUS=$(curl -s "$VERSIONS_URL" \
              | jq -r --arg v "$VERSION" '.[] | select(.version == $v) | .status')

            echo "[$(date -u +%H:%M:%S)] $VERSION -> ${STATUS:-not listed yet}"

            case "$STATUS" in
              NodeVersionStatusActive)
                echo "The Registry is serving $VERSION."
                exit 0
                ;;
              NodeVersionStatusFlagged|NodeVersionStatusBanned)
                echo "::error title=Registry rejected $VERSION::Status is $STATUS, so $VERSION is not installable and the Registry keeps serving the previous Active version. Open a manual review request at https://github.com/Comfy-Org/registry-backend/issues with the version UUID."
                exit 1
                ;;
            esac

            sleep 60
          done

          # Deliberately a warning, not a failure. Pending is a legitimate state that
          # has been observed to last beyond this deadline, so failing here would red
          # the build on healthy releases and the check would end up muted. Only a
          # terminal Flagged/Banned above is treated as a verdict.
          echo "::warning title=Registry has not activated $VERSION yet::Still ${STATUS:-unlisted} after $((TIMEOUT_SECONDS / 60)) minutes. Not a rejection - scans routinely take longer - but nothing reaches users until it is Active. Confirm with: curl -s https://api.comfy.org/nodes/comfyui-nodes-erpk | jq -r .latest_version.version"
          echo "Publish uploaded successfully; activation still outstanding."
