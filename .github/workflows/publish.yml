# ABOUTME: GitHub Actions workflow for publishing to ComfyUI Registry
# ABOUTME: Triggers on GitHub releases or manual dispatch

name: Publish to Comfy Registry

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  issues: write
  contents: read

jobs:
  publish-node:
    name: Publish Custom Node to Registry
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'eRepublik-Labs' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Publish Custom Node
        uses: Comfy-Org/publish-node-action@v1
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}

      - name: Update Registry Changelog
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Extract version from pyproject.toml
          VERSION=$(grep -E '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          echo "Version: $VERSION"

          # Get release notes from GitHub release using gh CLI (avoids shell interpolation issues)
          RELEASE_TAG="${{ github.event.release.tag_name }}"
          RELEASE_BODY=$(gh release view "$RELEASE_TAG" --json body -q .body 2>/dev/null || echo "")

          echo "Release tag: $RELEASE_TAG"
          echo "Release body length: ${#RELEASE_BODY}"

          # Skip if no release body
          if [ -z "$RELEASE_BODY" ]; then
            echo "No release notes found, skipping changelog update"
            exit 0
          fi

          # Look up the version UUID from the registry API
          # The PUT endpoint requires the database UUID, not the version string
          VERSION_ID=$(curl -s "https://api.comfy.org/nodes/comfyui-nodes-erpk/versions?limit=5" \
            | jq -r --arg v "$VERSION" '.[] | select(.version == $v) | .id')

          if [ -z "$VERSION_ID" ]; then
            echo "Warning: Could not find version UUID for $VERSION, skipping changelog update"
            exit 0
          fi
          echo "Version UUID: $VERSION_ID"

          # Escape JSON special characters (write to file first to preserve formatting)
          echo "$RELEASE_BODY" > release_notes.txt
          ESCAPED_BODY=$(cat release_notes.txt | jq -Rs .)

          # Update changelog via registry API using the version UUID
          echo "Updating changelog for version $VERSION ($VERSION_ID)..."

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X PUT "https://api.comfy.org/publishers/erpk/nodes/comfyui-nodes-erpk/versions/$VERSION_ID" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${REGISTRY_TOKEN}" \
            -d "{\"changelog\": $ESCAPED_BODY}")

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Changelog updated successfully (HTTP $HTTP_STATUS)"
          else
            echo "Warning: Changelog update returned HTTP $HTTP_STATUS"
            # Don't fail the workflow - publishing succeeded
          fi
